name: shopify-order-watcher

on:
  schedule:
    # JST 8〜22時台、15分ごと。UTCでは23時台と0〜13時台。
    # GitHub Actionsのscheduleは遅延/スキップが多いため飾り扱い。
    # 実際の定期起動は cron-job.org からの workflow_dispatch（camera-watcherと同方式）。
    - cron: '11,26,41,56 0-13,23 * * *'
  workflow_dispatch:       # 手動実行＋外部cron(cron-job.org)からの起動用
    inputs:
      force:
        description: '稼働時間(JST8-22)を無視して今すぐ実行する'
        type: boolean
        default: false

permissions:
  contents: write          # state.json をリポジトリに書き戻すため

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run watcher
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          FORCE_RUN: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python watcher.py

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state [skip ci]"
            git push
          else
            echo "state に変更なし"
          fi
